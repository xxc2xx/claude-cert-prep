<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Claude Builder Cert — Study Hub</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f2630;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #d68f3a;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header h1 .accent { color: var(--accent); }
  .stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .ok { color: var(--green); }
  .stats .bad { color: var(--red); }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .controls label {
    font-size: 13px;
    color: var(--muted);
  }
  .controls select, .controls button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .controls button:hover { background: #2a313c; }
  .controls button.danger { color: var(--red); }
  .controls .spacer { flex: 1; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .qmeta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .tag {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .tag.topic { color: var(--blue); }
  .qtext {
    font-size: 15px;
    margin-bottom: 14px;
  }
  .qtext code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: #ffb86c;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 14px;
  }
  .choice:hover { background: #242b35; }
  .choice input { margin-top: 3px; }
  .choice.correct {
    background: rgba(63, 185, 80, 0.12);
    border-color: var(--green);
  }
  .choice.wrong {
    background: rgba(248, 81, 73, 0.10);
    border-color: var(--red);
  }
  .choice.locked { cursor: default; }
  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .actions button {
    background: var(--accent);
    color: #0e1116;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .actions button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .actions button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-left: 3px solid var(--blue);
    border-radius: 4px;
    font-size: 13px;
    color: var(--text);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation b { color: var(--blue); }
  .explanation code {
    background: #0e1116;
    padding: 2px 5px;
    border-radius: 3px;
    color: #ffb86c;
  }
  .verdict {
    font-size: 13px;
    font-weight: 600;
    margin-left: auto;
  }
  .verdict.ok { color: var(--green); }
  .verdict.bad { color: var(--red); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Tab nav */
  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab-btn:hover { background: #242b35; }
  .tab-btn.active {
    background: var(--accent);
    color: #0e1116;
    border-color: var(--accent);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Notes (rendered markdown) */
  .notes-body {
    max-width: 760px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.65;
  }
  .notes-body h1 {
    color: var(--accent);
    font-size: 22px;
    margin: 0 0 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .notes-body h2 {
    color: var(--accent);
    font-size: 18px;
    margin: 28px 0 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .notes-body h3 { color: var(--blue); font-size: 15px; margin: 22px 0 8px; }
  .notes-body h4 { color: var(--text); font-size: 14px; margin: 16px 0 6px; }
  .notes-body p { margin: 0 0 10px; }
  .notes-body ul, .notes-body ol { margin: 0 0 12px 20px; }
  .notes-body li { margin-bottom: 4px; }
  .notes-body code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.9em;
    color: #ffb86c;
    font-family: 'SF Mono', Menlo, monospace;
  }
  .notes-body pre {
    background: var(--panel-2);
    padding: 12px 14px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 0 0 14px;
    border: 1px solid var(--border);
  }
  .notes-body pre code {
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 12px;
    line-height: 1.5;
  }
  .notes-body table {
    border-collapse: collapse;
    margin: 0 0 14px;
    width: 100%;
    font-size: 13px;
  }
  .notes-body th, .notes-body td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
  }
  .notes-body th { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .notes-body blockquote {
    border-left: 3px solid var(--blue);
    padding: 8px 14px;
    margin: 12px 0;
    color: var(--text);
    background: var(--panel-2);
    border-radius: 0 4px 4px 0;
  }
  .notes-body hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .notes-body strong { color: var(--text); font-weight: 600; }
  .notes-body em { color: var(--muted); }

  /* Sticky TOC */
  .notes-toc {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 12px 0 14px;
    margin: 0 0 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .notes-toc-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 6px;
  }
  .notes-toc a {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .notes-toc a:hover, .notes-toc a:active, .notes-toc a.active {
    background: var(--accent);
    color: #0e1116;
    border-color: var(--accent);
  }

  /* Loops tab — callout boxes */
  .loop-callout {
    padding: 12px 16px;
    border-radius: 6px;
    margin: 14px 0;
    font-size: 14px;
    line-height: 1.55;
  }
  .loop-callout-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .loop-callout-pitfall   { border-left: 3px solid var(--red);   background: rgba(248,81,73,.07); }
  .loop-callout-try       { border-left: 3px solid var(--green); background: rgba(63,185,80,.07); }
  .loop-callout-mechanism { border-left: 3px solid var(--blue);  background: rgba(88,166,255,.07); }
  .loop-callout-example   { border-left: 3px solid var(--accent);background: rgba(214,143,58,.07); }
  .loop-callout-gallery   { border-left: 3px solid #a371f7;      background: rgba(163,113,247,.07); }
  .loop-callout-objectives{ background: var(--panel-2); border: 1px solid var(--border); }
  .loop-callout-exercises { border-left: 3px solid #f0a050;      background: rgba(240,160,80,.07); }
  .loop-callout-summary   { background: var(--panel-2); border: 1px solid var(--border); border-top: 3px solid var(--border); }
  .loop-callout-pitfall   .loop-callout-label { color: var(--red);   }
  .loop-callout-try       .loop-callout-label { color: var(--green); }
  .loop-callout-mechanism .loop-callout-label { color: var(--blue);  }
  .loop-callout-example   .loop-callout-label { color: var(--accent);}
  .loop-callout-gallery   .loop-callout-label { color: #a371f7;      }
  .loop-callout-objectives.loop-callout-label,
  .loop-callout-summary   .loop-callout-label { color: var(--muted); }
  .loop-callout-exercises .loop-callout-label { color: #f0a050;      }

  /* Progress view */
  .progress-summary { display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
  .progress-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .progress-row h3 {
    margin: 0 0 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  .progress-row.overall h3 { color: var(--accent); font-size: 16px; }
  .progress-bar {
    height: 8px;
    background: var(--panel-2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, #56d364 100%);
    transition: width 0.4s;
  }
  .progress-fill.low { background: linear-gradient(90deg, var(--red) 0%, #ff7b72 100%); }
  .progress-fill.mid { background: linear-gradient(90deg, #d29922 0%, #e3b341 100%); }
  .progress-stats {
    font-size: 12.5px;
    color: var(--muted);
  }
  .progress-stats b { color: var(--text); font-weight: 600; }
  .progress-stats .ok { color: var(--green); }
  .progress-stats .bad { color: var(--red); }
  .weak-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .weak-list li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .weak-list li:last-child { border-bottom: none; }
  .weak-list .topic { color: var(--text); }
  .weak-list .count { color: var(--red); font-weight: 600; }

  /* Back to top button */
  .back-to-top {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--accent);
    color: #0e1116;
    border: none;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .15s;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .back-to-top.visible {
    opacity: 0.95;
    pointer-events: auto;
  }
  .back-to-top:hover { transform: translateY(-2px); opacity: 1; }
  .back-to-top:active { transform: translateY(0); }

  footer {
    max-width: 860px;
    margin: 40px auto 24px;
    padding: 0 24px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <div style="width: 100%;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      <h1>Claude Builder Cert — <span class="accent">Study Hub</span></h1>
      <div class="stats">
        <span><b id="stat-answered">0</b>/<b id="stat-total">0</b> answered</span>
        <span class="ok"><b id="stat-correct">0</b> correct</span>
        <span class="bad"><b id="stat-wrong">0</b> wrong</span>
        <span><b id="stat-pct">0%</b></span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="quiz">Quiz</button>
      <button class="tab-btn" data-tab="cheatsheet">Cheatsheet</button>
      <button class="tab-btn" data-tab="faq">FAQ</button>
      <button class="tab-btn" data-tab="brief">Brief</button>
      <button class="tab-btn" data-tab="manual">Manual</button>
      <button class="tab-btn" data-tab="loops">Loops</button>
      <button class="tab-btn" data-tab="progress">Progress</button>
    </nav>
  </div>
</header>

<main>
  <!-- ===== Quiz tab ===== -->
  <section id="tab-quiz" class="tab-content active">
    <div class="controls">
      <label>Block:
        <select id="filter-block">
          <option value="">All</option>
        </select>
      </label>
      <label>Topic:
        <select id="filter-topic">
          <option value="">All</option>
        </select>
      </label>
      <label>Show:
        <select id="filter-status">
          <option value="">All</option>
          <option value="unanswered">Unanswered</option>
          <option value="wrong">Got wrong</option>
          <option value="correct">Got correct</option>
        </select>
      </label>
      <label><input type="checkbox" id="shuffle" /> Shuffle</label>
      <div class="spacer"></div>
      <button id="reset" class="danger">Reset progress</button>
    </div>

    <div id="quiz"></div>
  </section>

  <!-- ===== Cheatsheet tab ===== -->
  <section id="tab-cheatsheet" class="tab-content">
    <div class="notes-body" id="cheatsheet-body">Loading cheatsheet…</div>
  </section>

  <!-- ===== FAQ tab ===== -->
  <section id="tab-faq" class="tab-content">
    <div class="notes-body" id="faq-body">Loading FAQ…</div>
  </section>

  <!-- ===== Brief tab (super-user presentation prep) ===== -->
  <section id="tab-brief" class="tab-content">
    <div class="notes-body" id="brief-body">Loading brief…</div>
  </section>

  <!-- ===== Manual tab (long-form field manual) ===== -->
  <section id="tab-manual" class="tab-content">
    <div class="notes-body" id="manual-body">Loading manual…</div>
  </section>

  <!-- ===== Loops tab (Claude Code Loops coursebook by Derek Hobden) ===== -->
  <section id="tab-loops" class="tab-content">
    <div class="notes-body" id="loops-body">Loading loops manual…</div>
  </section>

  <!-- ===== Progress tab ===== -->
  <section id="tab-progress" class="tab-content">
    <div class="progress-summary" id="progress-body"></div>
  </section>
</main>

<footer>
  Progress saved locally in your browser. Cheatsheet: <code>~/claude-cert-prep/cheatsheet.md</code>
</footer>

<button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script>
const QUESTIONS = [
  // ===== Block 1: Foundations =====
  {
    id: "b1-q1",
    block: "1 — Foundations",
    topic: "Messages API",
    q: "You send <code>messages=[{\"role\": \"assistant\", \"content\": \"Hello\"}]</code> as the only message. What happens?",
    choices: [
      "Claude responds normally — assistant-first is allowed",
      "API error — first message must have role 'user'",
      "Claude continues the assistant turn (prefill)",
      "API error — system prompt is required first"
    ],
    answer: 1,
    explain: "The first message in <code>messages</code> must be <b>role: 'user'</b> (after any top-level system prompt). Assistant-first is invalid. (Note: you CAN end with an assistant message — that's called <b>prefill</b> — but you can't start with one.)"
  },
  {
    id: "b1-q2",
    block: "1 — Foundations",
    topic: "Stop reasons",
    q: "What's the difference between <code>stop_reason: 'end_turn'</code> and <code>stop_reason: 'stop_sequence'</code>?",
    choices: [
      "Both mean Claude finished naturally — they're aliases",
      "'end_turn' = Claude decided to stop; 'stop_sequence' = output hit a string in your <code>stop_sequences</code> param",
      "'end_turn' = max_tokens reached; 'stop_sequence' = Claude finished naturally",
      "'stop_sequence' is only used in streaming mode"
    ],
    answer: 1,
    explain: "<b>end_turn</b> = Claude naturally finished its response. <b>stop_sequence</b> = the output emitted one of the strings you passed in the <code>stop_sequences</code> parameter, so generation halted early. You also check <code>response.stop_sequence</code> to see which one matched."
  },
  {
    id: "b1-q3",
    block: "1 — Foundations",
    topic: "Token usage",
    q: "Which usage field tells you how many tokens were read FROM the prompt cache (cache hit)?",
    choices: [
      "<code>input_tokens</code>",
      "<code>cache_creation_input_tokens</code>",
      "<code>cache_read_input_tokens</code>",
      "<code>cached_tokens</code>"
    ],
    answer: 2,
    explain: "<b>cache_read_input_tokens</b> = tokens served from cache (billed at ~10% of normal input cost). <b>cache_creation_input_tokens</b> = tokens written to cache on a miss (billed at ~125% to seed it). Regular <code>input_tokens</code> = non-cached input."
  },
  {
    id: "b1-q4",
    block: "1 — Foundations",
    topic: "Required params",
    q: "True or False: omitting <code>max_tokens</code> defaults to the model's max context window.",
    choices: [
      "True",
      "False — it's a required field and the request will error"
    ],
    answer: 1,
    explain: "<code>max_tokens</code> is <b>required</b> in the Messages API. There's no default. This trips up developers coming from OpenAI's API where it's optional. The value caps the OUTPUT length, not input."
  },
  {
    id: "b1-q5",
    block: "1 — Foundations",
    topic: "Determinism",
    q: "You want deterministic, repeatable output for a classifier. What temperature do you set?",
    choices: [
      "<code>1.0</code> (the default)",
      "<code>0.0</code>",
      "<code>0.5</code>",
      "Temperature doesn't affect determinism — use <code>top_p=0</code>"
    ],
    answer: 1,
    explain: "<b>temperature=0.0</b> is the closest you get to deterministic output (greedy sampling — always pick the highest-probability token). Note: it's <b>near-deterministic</b>, not perfectly so — there can still be tiny variation from GPU non-determinism, but it's the right answer for classification."
  },
  {
    id: "b1-q6",
    block: "1 — Foundations",
    topic: "Model selection",
    q: "Which is the correct, full model ID for the current Haiku?",
    choices: [
      "<code>claude-haiku-4-5</code>",
      "<code>claude-haiku-4.5</code>",
      "<code>claude-haiku-4-5-20251001</code>",
      "<code>claude-4-5-haiku</code>"
    ],
    answer: 2,
    explain: "Full ID is <code>claude-haiku-4-5-20251001</code> with the dated suffix. Opus 4.7 is <code>claude-opus-4-7</code>; Sonnet 4.6 is <code>claude-sonnet-4-6</code>. Know the exact strings — typos in model IDs cause 404s, not silent fallback."
  },
  {
    id: "b1-q7",
    block: "1 — Foundations",
    topic: "Messages API",
    q: "Where does the system prompt go in the Messages API?",
    choices: [
      "As the first message with <code>role: 'system'</code>",
      "As a top-level <code>system</code> field on the request",
      "Inside the first user message wrapped in <code>&lt;system&gt;</code> tags",
      "As a parameter named <code>system_prompt</code>"
    ],
    answer: 1,
    explain: "Top-level <code>system</code> field — NOT a message with role 'system' (that's OpenAI's convention). The <code>messages</code> array only contains user/assistant turns."
  },

  // ===== Block 2: Prompting techniques =====
  {
    id: "b2-q1",
    block: "2 — Prompting",
    topic: "Structure",
    q: "What structure does Anthropic explicitly recommend for delimiting sections of a prompt (documents, examples, instructions)?",
    choices: [

// ----- state -----
// localStorage is unavailable on file:// origins in iOS Files QuickLook
// and can throw when storage is full / private browsing. Fall back to an
// in-memory store so the rest of the app keeps working.
const STORAGE_KEY = "claude-cert-quiz-v1";
const __storage = (() => {
  try {
    const testKey = '__t__' + Date.now();
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return window.localStorage;
  } catch (e) {
    let mem = {};
    return {
      getItem: (k) => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: (k) => { delete mem[k]; }
    };
  }
})();

let progress = {};
try {
  progress = JSON.parse(__storage.getItem(STORAGE_KEY) || "{}");
} catch (e) {
  progress = {};
}
// progress[questionId] = { chosen: <int>, correct: <bool> }

function saveProgress() {
  try {
    __storage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    // best-effort; ignore quota / access errors
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function populateFilters() {
  const blocks = [...new Set(QUESTIONS.map(q => q.block))].sort();
  const topics = [...new Set(QUESTIONS.map(q => q.topic))].sort();
  const bSel = document.getElementById("filter-block");
  const tSel = document.getElementById("filter-topic");
  blocks.forEach(b => {
    const o = document.createElement("option");
    o.value = b; o.textContent = b;
    bSel.appendChild(o);
  });
  topics.forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    tSel.appendChild(o);
  });
}

function getFiltered() {
  const block = document.getElementById("filter-block").value;
  const topic = document.getElementById("filter-topic").value;
  const status = document.getElementById("filter-status").value;
  const shuf = document.getElementById("shuffle").checked;

  let list = QUESTIONS.filter(q => {
    if (block && q.block !== block) return false;
    if (topic && q.topic !== topic) return false;
    const p = progress[q.id];
    if (status === "unanswered" && p) return false;
    if (status === "wrong" && (!p || p.correct)) return false;
    if (status === "correct" && (!p || !p.correct)) return false;
    return true;
  });

  return shuf ? shuffle(list) : list;
}

function renderStats() {
  const total = QUESTIONS.length;
  const answered = Object.keys(progress).length;
  const correct = Object.values(progress).filter(p => p.correct).length;
  const wrong = answered - correct;
  const pct = answered ? Math.round(100 * correct / answered) : 0;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-answered").textContent = answered;
  document.getElementById("stat-correct").textContent = correct;
  document.getElementById("stat-wrong").textContent = wrong;
  document.getElementById("stat-pct").textContent = pct + "%";
}

function renderQuestion(q, idx) {
  const card = document.createElement("div");
  card.className = "card";
  const p = progress[q.id];
  const locked = !!p;

  card.innerHTML = `
    <div class="qmeta">
      <span class="tag">${q.block}</span>
      <span class="tag topic">${q.topic}</span>
      <span>Q${idx + 1}</span>
      ${locked ? `<span class="verdict ${p.correct ? 'ok' : 'bad'}">${p.correct ? '✓ Correct' : '✗ Wrong'}</span>` : ""}
    </div>
    <div class="qtext">${q.q}</div>
    <div class="choices">
      ${q.choices.map((c, i) => {
        let cls = "choice";
        if (locked) {
          cls += " locked";
          if (i === q.answer) cls += " correct";
          else if (i === p.chosen) cls += " wrong";
        }
        return `
          <label class="${cls}">
            <input type="radio" name="${q.id}" value="${i}" ${locked ? "disabled" : ""} ${p && p.chosen === i ? "checked" : ""} />
            <span>${c}</span>
          </label>`;
      }).join("")}
    </div>
    <div class="actions">
      <button data-action="submit" data-qid="${q.id}" ${locked ? "disabled" : ""}>${locked ? "Answered" : "Submit"}</button>
      <button class="secondary" data-action="reveal" data-qid="${q.id}">${locked ? "Hide explanation" : "Reveal answer"}</button>
      ${locked ? `<button class="secondary" data-action="retry" data-qid="${q.id}">Retry</button>` : ""}
    </div>
    <div class="explanation ${locked ? 'show' : ''}" id="exp-${q.id}">
      <b>Answer:</b> ${q.choices[q.answer].replace(/<[^>]+>/g, '')} <br/>
      ${q.explain}
    </div>
  `;
  return card;
}

function render() {
  const list = getFiltered();
  const root = document.getElementById("quiz");
  root.innerHTML = "";
  if (!list.length) {
    root.innerHTML = `<div class="empty">No questions match these filters.</div>`;
  } else {
    list.forEach((q, i) => root.appendChild(renderQuestion(q, i)));
  }
  renderStats();
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const qid = btn.dataset.qid;
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q) return;

  if (action === "submit") {
    const checked = document.querySelector(`input[name="${qid}"]:checked`);
    if (!checked) { alert("Pick an answer first."); return; }
    const chosen = parseInt(checked.value, 10);
    const correct = chosen === q.answer;
    progress[qid] = { chosen, correct };
    saveProgress();
    render();
  } else if (action === "reveal") {
    const exp = document.getElementById(`exp-${qid}`);
    exp.classList.toggle("show");
  } else if (action === "retry") {
    delete progress[qid];
    saveProgress();
    render();
  }
});

document.getElementById("filter-block").addEventListener("change", render);
document.getElementById("filter-topic").addEventListener("change", render);
document.getElementById("filter-status").addEventListener("change", render);
document.getElementById("shuffle").addEventListener("change", render);
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Reset ALL progress?")) {
    progress = {};
    saveProgress();
    render();
  }
});

populateFilters();
render();

// ===== Tabs =====
// Splittable tabs render only one section at a time, controlled by a chip bar.
// State is keyed by tab name. The first load fetches + parses + splits the
// markdown; subsequent chip clicks just re-render the active section.
const splittableState = new Map();

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-content').forEach(s => {
      s.classList.toggle('active', s.id === 'tab-' + tab);
    });
    if (tab === 'cheatsheet') loadCheatsheetSplit();
    if (tab === 'faq') loadFaqSplit();
    if (tab === 'brief') loadBriefSplit();
    if (tab === 'manual') loadManualSplit();
    if (tab === 'loops') loadLoopsSplit();
    if (tab === 'progress') renderProgress();
  });
});

function slugify(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function shortenLabel(text, maxLen) {
  const blockMatch = text.match(/^(Block \d+)/);
  if (blockMatch) return blockMatch[1];
  if (text.length <= maxLen) return text;
  return text.slice(0, maxLen - 1).trim() + '…';
}

function buildTOC(container, selector, label, labelMaxLen, customLabeler) {
  const headings = container.querySelectorAll(selector);
  if (!headings.length) return;
  const toc = document.createElement('div');
  toc.className = 'notes-toc';
  const lbl = document.createElement('span');
  lbl.className = 'notes-toc-label';
  lbl.textContent = label;
  toc.appendChild(lbl);
  headings.forEach(h => {
    const labelText = customLabeler
      ? customLabeler(h.textContent)
      : shortenLabel(h.textContent, labelMaxLen);
    if (labelText === null) return; // labeler can skip a heading
    const id = slugify(h.textContent);
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = labelText;
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    toc.appendChild(a);
  });
  container.insertBefore(toc, container.firstChild);
}

// Parse markdown safely using DOMParser (avoids Safari iOS innerHTML quirks
// where some block-level tags get silently dropped during fragment parsing).
function parseMarkdownToNodes(md) {
  const html = marked.parse(md);
  const doc = new DOMParser().parseFromString(
    '<!DOCTYPE html><html><body>' + html + '</body></html>',
    'text/html'
  );
  return Array.from(doc.body.childNodes);
}

// Walk a flat list of nodes and group them into sections, starting a new
// section whenever we encounter a heading of the given tag. The labelFn
// decides each section's chip label; returning null means "no chip for
// this section" (the content still renders if it's the active section).
function splitNodesByHeading(nodes, headingTag, labelFn) {
  const tag = headingTag.toLowerCase();
  const sections = [];
  let current = { label: null, nodes: [] };
  nodes.forEach(node => {
    const nodeName = (node.nodeName || '').toLowerCase();
    if (nodeName === tag) {
      if (current.nodes.length) sections.push(current);
      const text = node.textContent || '';
      current = { label: labelFn(text), headingText: text, nodes: [node] };
    } else {
      current.nodes.push(node);
    }
  });
  if (current.nodes.length) sections.push(current);
  return sections;
}

// Render one section of a splittable tab. Builds the chip bar then appends
// the active section's content.
function renderSplittableActive(tabName) {
  const state = splittableState.get(tabName);
  if (!state) return;
  const { sections, activeIdx, chipLabel, containerId } = state;
  const container = document.getElementById(containerId);
  container.replaceChildren();

  const chipBar = document.createElement('div');
  chipBar.className = 'notes-toc';
  const lbl = document.createElement('span');
  lbl.className = 'notes-toc-label';
  lbl.textContent = chipLabel;
  chipBar.appendChild(lbl);

  sections.forEach((section, i) => {
    if (section.label === null) return; // unlabeled sections get no chip
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = section.label;
    if (i === activeIdx) a.classList.add('active');
    a.addEventListener('click', e => {
      e.preventDefault();
      state.activeIdx = i;
      renderSplittableActive(tabName);
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipBar.appendChild(a);
  });
  container.appendChild(chipBar);

  const content = document.createElement('div');
  const section = sections[activeIdx];
  if (section) {
    section.nodes.forEach(n => content.appendChild(n.cloneNode(true)));
  }
  container.appendChild(content);
  if (tabName === 'loops') postProcessLoops(content);
}

// Apply callout-box styling to paragraphs in the Loops tab that start with
// recognised keywords (Pitfall, Try it, Mechanism, Worked Example, etc.).
function postProcessLoops(root) {
  const patterns = [
    { re: /^Pitfall\s*·/,          cls: 'loop-callout loop-callout-pitfall'    },
    { re: /^Try it\s*·/,           cls: 'loop-callout loop-callout-try'        },
    { re: /^Mechanism\s*·/,        cls: 'loop-callout loop-callout-mechanism'  },
    { re: /^Worked Example\s+[\d.]/, cls: 'loop-callout loop-callout-example'  },
    { re: /^Gallery\s+[\d.]/,      cls: 'loop-callout loop-callout-gallery'    },
    { re: /^Learning objectives/,  cls: 'loop-callout loop-callout-objectives' },
    { re: /^Exercises\s+\d/,       cls: 'loop-callout loop-callout-exercises'  },
    { re: /^Summary/,              cls: 'loop-callout loop-callout-summary'     },
  ];
  root.querySelectorAll('p').forEach(p => {
    const text = p.textContent || '';
    for (const { re, cls } of patterns) {
      if (!re.test(text)) continue;
      p.className = (p.className ? p.className + ' ' : '') + cls;
      // Split first line (label) from body on the embedded newline character.
      const nl = text.indexOf('\n');
      const label = (nl > -1 ? text.slice(0, nl) : text).trim();
      const body  = (nl > -1 ? text.slice(nl + 1) : '').trim();
      p.innerHTML = '<strong class="loop-callout-label">' + label + '</strong>'
        + (body ? '<span>' + body + '</span>' : '');
      break;
    }
  });
}

async function loadSplittable(tabName, url, containerId, headingTag, labelFn, chipLabel, sectionFilter) {
  if (splittableState.has(tabName)) return;
  const container = document.getElementById(containerId);
  try {
    const res = await fetch(url + '?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const sourceNodes = sectionFilter
      ? sectionFilter(parseMarkdownToNodes(md), md)
      : parseMarkdownToNodes(md);
    const sections = splitNodesByHeading(sourceNodes, headingTag, labelFn);
    const firstLabeledIdx = sections.findIndex(s => s.label !== null);
    const activeIdx = firstLabeledIdx === -1 ? 0 : firstLabeledIdx;
    splittableState.set(tabName, { sections, activeIdx, chipLabel, containerId });
    renderSplittableActive(tabName);
  } catch (e) {
    container.innerHTML =
      '<p style="color: var(--red);">Error loading content: ' + e.message + '</p>';
  }
}

// ---- Per-tab configs ----

function loadManualSplit() {
  return loadSplittable(
    'manual',
    './field_manual.md',
    'manual-body',
    'h2',
    (text) => {
      const m = text.match(/^(\d+)/);
      if (m) return m[1];
      if (/^appendix/i.test(text)) return 'App';
      return null; // intro paragraphs, "Closing"
    },
    'Chapter'
  );
}

function loadCheatsheetSplit() {
  return loadSplittable(
    'cheatsheet',
    './cheatsheet.md',
    'cheatsheet-body',
    'h2',
    (text) => {
      const m = text.match(/^Block\s+(\d+)/i);
      if (m) return 'B' + m[1];
      return null; // skip FAQ (it has its own tab) and any non-block H2
    },
    'Block'
  );
}

function loadBriefSplit() {
  return loadSplittable(
    'brief',
    './super_user_brief.md',
    'brief-body',
    'h2',
    (text) => {
      const arcMatch = text.match(/^Arc\s+(\d+)/i);
      if (arcMatch) return 'Arc ' + arcMatch[1];
      if (/^how to use/i.test(text)) return 'How';
      if (/^anticipated/i.test(text)) return 'Q&A';
      if (/^demo cheatsheet/i.test(text)) return 'Demo';
      if (/^what to not/i.test(text)) return 'Avoid';
      return null;
    },
    'Section'
  );
}

function loadLoopsSplit() {
  return loadSplittable(
    'loops',
    './loops_manual.md',
    'loops-body',
    'h2',
    (text) => {
      const m = text.match(/^Ch\s+(\d+)/i);
      if (m) return 'Ch ' + m[1];
      if (/^App/i.test(text)) return 'App';
      return null; // Preface, How to use — shown when active but no chip
    },
    'Chapter'
  );
}

// FAQ is special: it lives inside cheatsheet.md as a single H2 with H3
// sub-sections (one per block). We narrow to just the FAQ section first,
// then split that section's nodes by H3.
function loadFaqSplit() {
  return loadSplittable(
    'faq',
    './cheatsheet.md',
    'faq-body',
    'h3',
    (text) => {
      const m = text.match(/^Block\s+(\d+)/i);
      if (m) return 'B' + m[1];
      if (/^career/i.test(text)) return 'Career';
      return null;
    },
    'FAQ',
    (allNodes, md) => {
      // Filter to just the nodes between the FAQ H2 and the next H2.
      let inFaq = false;
      const out = [];
      for (const n of allNodes) {
        const tag = (n.nodeName || '').toLowerCase();
        const text = n.textContent || '';
        if (tag === 'h2') {
          if (/^FAQ/i.test(text)) {
            inFaq = true;
            continue; // skip the FAQ H2 itself
          }
          if (inFaq) break; // hit the next H2 — stop
        }
        if (inFaq) out.push(n);
      }
      return out;
    }
  );
}

// ===== Progress =====
function renderProgress() {
  const body = document.getElementById('progress-body');

  const total = QUESTIONS.length;
  const answered = Object.keys(progress).length;
  const correct = Object.values(progress).filter(p => p.correct).length;
  const wrong = answered - correct;
  const pct = answered ? Math.round(100 * correct / answered) : 0;

  // By block
  const blocks = {};
  QUESTIONS.forEach(q => {
    if (!blocks[q.block]) blocks[q.block] = { total: 0, answered: 0, correct: 0 };
    blocks[q.block].total++;
    const p = progress[q.id];
    if (p) {
      blocks[q.block].answered++;
      if (p.correct) blocks[q.block].correct++;
    }
  });

  // Weak topics (got wrong at least once)
  const wrongTopics = {};
  QUESTIONS.forEach(q => {
    const p = progress[q.id];
    if (p && !p.correct) {
      wrongTopics[q.topic] = (wrongTopics[q.topic] || 0) + 1;
    }
  });

  // Wrong question list with IDs (so user can find them in quiz)
  const wrongIds = QUESTIONS
    .filter(q => progress[q.id] && !progress[q.id].correct)
    .map(q => ({ id: q.id, block: q.block, topic: q.topic, q: q.q }));

  const pctClass = pct >= 80 ? '' : pct >= 60 ? 'mid' : 'low';

  let html = `
    <div class="progress-row overall">
      <h3>Overall</h3>
      <div class="progress-bar"><div class="progress-fill ${pctClass}" style="width: ${pct}%"></div></div>
      <div class="progress-stats">
        <b>${answered}</b>/${total} answered &nbsp;·&nbsp;
        <span class="ok"><b>${correct}</b> correct</span> &nbsp;·&nbsp;
        <span class="bad"><b>${wrong}</b> wrong</span> &nbsp;·&nbsp;
        <b>${pct}%</b>
      </div>
    </div>
  `;

  for (const [block, s] of Object.entries(blocks)) {
    const bp = s.answered ? Math.round(100 * s.correct / s.answered) : 0;
    const bpClass = bp >= 80 ? '' : bp >= 60 ? 'mid' : 'low';
    html += `
      <div class="progress-row">
        <h3>${block}</h3>
        <div class="progress-bar"><div class="progress-fill ${bpClass}" style="width: ${bp}%"></div></div>
        <div class="progress-stats">
          ${s.answered}/${s.total} answered &nbsp;·&nbsp;
          <span class="ok">${s.correct} correct</span> &nbsp;·&nbsp;
          <span class="bad">${s.answered - s.correct} wrong</span> &nbsp;·&nbsp;
          ${bp}%
        </div>
      </div>
    `;
  }

  if (Object.keys(wrongTopics).length) {
    html += `<div class="progress-row"><h3>Weak topics — got wrong at least once</h3><ul class="weak-list">`;
    for (const [topic, n] of Object.entries(wrongTopics).sort((a, b) => b[1] - a[1])) {
      html += `<li><span class="topic">${topic}</span><span class="count">${n} wrong</span></li>`;
    }
    html += `</ul></div>`;
  }

  if (wrongIds.length) {
    html += `<div class="progress-row"><h3>Questions to retry</h3><ul class="weak-list">`;
    for (const w of wrongIds) {
      html += `<li><span class="topic"><b>${w.id}</b> · ${w.topic}</span><span class="count" style="color: var(--muted); font-weight: normal; font-size: 11px;">${w.block}</span></li>`;
    }
    html += `<li style="padding-top: 10px; border-top: none;"><span style="color: var(--muted); font-size: 12px;">Switch to the Quiz tab and set "Show: Got wrong" to drill these.</span></li></ul></div>`;
  }

  if (!answered) {
    html += `<div class="progress-row"><div class="progress-stats" style="text-align: center; padding: 20px;">No answers yet — start the Quiz tab.</div></div>`;
  }

  body.innerHTML = html;
}
</script>
</body>
</html>
